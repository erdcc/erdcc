<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zara Fiyat Takip Paneli</title>
    <style>
        :root {
            --primary: #000000;
            --accent: #007bff;
            --bg: #f8f9fa;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: var(--primary);
        }
        .container {
            text-align: center;
            background: white;
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 90%;
        }
        .logo {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 1rem;
        }
        h1 { font-size: 1.2rem; margin-bottom: 1rem; color: #444; }
        p { color: #666; line-height: 1.5; margin-bottom: 2rem; font-size: 0.95rem; }
        .btn {
            display: inline-block;
            background-color: var(--primary);
            color: white;
            text-decoration: none;
            padding: 12px 30px;
            border-radius: 50px;
            font-weight: 600;
            transition: transform 0.2s, background-color 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
            background-color: #333;
        }
        .status {
            margin-top: 1.5rem;
            font-size: 0.8rem;
            color: #28a745;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
        .dot { height: 8px; width: 8px; background-color: #28a745; border-radius: 50%; display: inline-block; }
    </style>
</head>
<body>

<div class="container">
    <div class="logo">ZARA</div>
    <h1>Fiyat Takip Sistemi</h1>
    <p>Raspberry Pi 5 üzerinde çalışan canlı takip paneline erişmek için aşağıdaki butona tıklayın.</p>
    
    <a href="https://SENIN-TUNNEL-LINKIN.trycloudflare.com" class="btn">Panele Git</a>

    <div class="status">
        <span class="dot"></span> Sistem Aktif
    </div>
</div>

</body>
</html>
